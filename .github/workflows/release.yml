name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-android-web:
    name: Release Android + Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup google-services.json for CI
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            echo '{"project_info":{"project_number":"25616595982","project_id":"veltrix-sports","storage_bucket":"veltrix-sports.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:25616595982:android:d3aa8cf032ea388fc8d05f","android_client_info":{"package_name":"com.veltrixsports.veltrix_sports"}},"api_key":[{"current_key":"ci-placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          printf "storeFile=release-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.VERSION }}+${{ github.run_number }}/" pubspec.yaml

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Build Web
        run: flutter build web --release --no-tree-shake-icons --dart-define=VELTRIX_PRODUCTION=true

      - name: Zip Web
        run: zip -r web-build.zip build/web

      - name: Build Android APK
        run: flutter build apk --release --dart-define=VELTRIX_PRODUCTION=true --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ github.run_number }}

      - name: Build Android App Bundle
        run: flutter build appbundle --release --dart-define=VELTRIX_PRODUCTION=true --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-web
          path: |
            web-build.zip
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  release-windows:
    name: Release Windows (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Get version from tag
        id: version
        run: echo "VERSION=$($env:GITHUB_REF -replace 'refs/tags/v','')" >> $env:GITHUB_OUTPUT
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build Windows with CMake 3.x
        # windows-latest ships CMake 4.x, which removed support for the
        # cmake_minimum_required(<3.5) used by firebase_cpp_sdk_windows.
        # Flutter does NOT honor PATH here (it probes well-known VS/CMake
        # install dirs), so replace the 4.x binaries in place. The runner
        # is disposable, so overwriting is safe.
        run: |
          Invoke-WebRequest -Uri https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip -OutFile "$env:TEMP/cmake.zip"
          Expand-Archive -Path "$env:TEMP/cmake.zip" -DestinationPath C:\cmake-3.31 -Force
          $newBin = "C:\cmake-3.31\cmake-3.31.6-windows-x86_64\bin"
          $cands = @("C:\Program Files\CMake\bin\cmake.exe") + @(Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter cmake.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          foreach ($c in $cands | Select-Object -Unique) {
            if (-not $c) { continue }
            $v = (& $c --version | Select-Object -First 1) 2>$null
            Write-Host "$c -> $v"
            if ($v -match "cmake version ([4-9]|[1-9][0-9])\.") {
              Write-Host "Replacing 4.x with 3.31.6: $c"
              Copy-Item "$newBin\*" (Split-Path $c) -Force
            }
          }
          $env:PATH = "$newBin;$env:PATH"
          flutter build windows --release --dart-define=VELTRIX_PRODUCTION=true --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ github.run_number }}
      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-build.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows-build.zip
          retention-days: 30

  release-linux:
    name: Release Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=VELTRIX_PRODUCTION=true --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ github.run_number }}
      - name: Tar Linux bundle
        run: tar -czf linux-build.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: linux-build.tar.gz
          retention-days: 30

  release-macos:
    name: Release macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=VELTRIX_PRODUCTION=true --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ github.run_number }}
      - name: Zip macOS build
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app macos-build.zip || (cd build/macos/Build/Products/Release && zip -r ../../../../../macos-build.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: macos-build.zip
          retention-days: 30

  release-ios:
    name: Release iOS (ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - run: flutter pub get
      # Signed IPA — requires Apple secrets. Skipped gracefully if not set.
      - name: Import signing (if secrets present)
        id: signing
        continue-on-error: true
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          test -n "$IOS_CERTIFICATE_BASE64"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > ios_cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import ios_cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
      - name: Build signed IPA
        if: steps.signing.outcome == 'success'
        run: flutter build ipa --release --dart-define=VELTRIX_PRODUCTION=true --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ github.run_number }}
      - name: Build unsigned (fallback)
        if: steps.signing.outcome != 'success'
        run: flutter build ios --release --no-codesign --dart-define=VELTRIX_PRODUCTION=true --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: steps.signing.outcome == 'success'
        with:
          name: release-ios
          path: build/ios/ipa/*.ipa
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [release-android-web, release-windows, release-linux, release-macos, release-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List artifacts
        run: find dist -type f | head -50
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/release-android-web/*
            dist/release-windows/*
            dist/release-linux/*
            dist/release-macos/*
            dist/release-ios/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
