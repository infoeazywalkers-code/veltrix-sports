name: Feature Request
description: Suggest an idea for Veltrix Sports
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: A clear and concise description of what problem this feature would solve.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve workflow
        - High - Blocking current workflow
        - Critical - Required for production use
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of the app does this feature relate to?
      options:
        - Authentication
        - Calendar
        - Coach Match
        - Devices
        - Home/Dashboard
        - Premium/Subscriptions
        - Profile/Settings
        - Strength Training
        - Video Player
        - Workout Tracking
        - UI/UX
        - Performance
        - Other
    validations:
      required: true