<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Veltrix Sports training, coaching, performance tracking, and device sync.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Veltrix Sports">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Veltrix Sports</title>
  <link rel="manifest" href="manifest.json">
  <!-- Razorpay Web Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    /*
     * The hero <video> platform view floats above the Flutter canvas and
     * would otherwise swallow mouse-wheel events, freezing page scroll over
     * it. Making it click-through lets wheel/trackpad scroll pass through
     * to the page while the video keeps playing underneath.
     */
    video {
      pointer-events: none !important;
    }
    /*
     * The platform video element is inserted into the DOM seconds after
     * load; without this, Chrome's scroll anchoring compensates for the DOM
     * mutation by jumping the page scroll position. Flutter owns its scroll
     * offset, so browser anchoring must stay off.
     */
    html,
    body {
      overflow-anchor: none;
    }
    /*
     * On-brand site-wide cursor: lime ring with navy center dot.
     * Applied on `html` so it inherits into the Flutter canvas.
     * No `*` selector: UA form styles must keep winning in text fields
     * so the I-beam caret still shows while typing.
     */
    html {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><circle cx='14' cy='14' r='9' fill='none' stroke='%23c8f169' stroke-width='2.5'/><circle cx='14' cy='14' r='3.5' fill='%23123047'/></svg>") 14 14, auto;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
